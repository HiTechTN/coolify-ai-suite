name: Validate Installation Script

on:
  workflow_dispatch:
    inputs:
      test_mode:
        description: 'Test mode (syntax, docker-validation)'
        required: true
        default: 'syntax'
        type: choice
        options:
          - syntax
          - docker-validation

jobs:
  validate-syntax:
    name: Syntax Validation
    if: github.event.inputs.test_mode == 'syntax' || github.event.inputs.test_mode == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate all shell scripts (root + lib)
        run: |
          echo "=== Checking bash syntax ==="
          for script in *.sh lib/*.sh; do
            if [ -f "$script" ]; then
              echo -n "Checking: $script ... "
              bash -n "$script" && echo "✓" || { echo "✗"; exit 1; }
            fi
          done

      - name: Check for common issues
        run: |
          echo "=== Checking for common issues ==="
          for script in *.sh; do
            if [ -f "$script" ]; then
              # Check for hardcoded IPs (excluding comments and examples)
              if grep -qE '(^|[^#])[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}\.[0-9]{1,3}' "$script" 2>/dev/null; then
                # Exclude known safe patterns
                if ! grep -qE '(api\.ipify\.org|ifconfig\.me|icanhazip\.com|0\.0\.0\.0|127\.0\.0\.1|docker\.com)' "$script" 2>/dev/null; then
                  echo "⚠ $script may contain hardcoded IP"
                fi
              fi
              # Check for set -euo pipefail
              if ! grep -q 'set -euo pipefail' "$script" 2>/dev/null; then
                echo "⚠ $script missing 'set -euo pipefail'"
              fi
            fi
          done

  validate-docker:
    name: Docker Compose Validation
    if: github.event.inputs.test_mode == 'docker-validation'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Validate Compose syntax
        run: |
          echo "=== Checking for compose files ==="
          find /opt/ai-suite -name "docker-compose.yml" 2>/dev/null || echo "  (dossier non présent - installation requise)"
